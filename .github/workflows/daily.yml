name: Daily review

on:
  schedule:
    # 22:00 Asia/Shanghai = 14:00 UTC. GitHub Actions may delay a few minutes.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.AUTO_REVIEW_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate report and dashboard
        run: |
          python daily_review/review.py
          python daily_review/build_dashboard.py

      - name: Assemble static site
        run: |
          mkdir -p site/reports
          cp daily_review/dashboard.html site/index.html
          cp daily_review/reports/latest.md site/reports/latest.md
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
